on: [push]

env: 
    path-to-file: "app/build/outputs/apk/release/app-release.apk"
jobs:
  kryptowire_analysis_job:
    runs-on: ubuntu-latest
    name: Build and submit app to Quokka
    steps:
      - uses: actions/checkout@v4

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Run Build Project
      - name: Build gradle project
        run: ./gradlew build

      # Create APK Debug
      - name: Build apk debug project (APK) - ${{ env.main_project_module }} module
        run: ./gradlew assembleDebug

      # Create APK Release
      - name: Build apk release project (APK) - ${{ env.main_project_module }} module
        run: ./gradlew assemble
        
      - name: Kryptowire Analysis Submission
        uses: ./ # Uses an action in the root directory
        id: appSubmit
        with:
          path-to-file: ${{ env.path-to-file }}
          platform: "android"
          apiKey: ${{ secrets.KRYPTOWIRE_API_KEY }}

        # --- NEW STEP TO FIX SARIF LOCATIONS ---
      - name: Fix missing locations in SARIF
        run: |
          python3 -c "
          import json
          path = '${{ env.path-to-file }}.sarif'
          try:
              with open(path, 'r') as f:
                  data = json.load(f)

              # Loop through results and inject a dummy location if missing
              for run in data.get('runs', []):
                  for res in run.get('results', []):
                      if not res.get('locations'):
                          res['locations'] = [{
                              'physicalLocation': {
                                  'artifactLocation': {'uri': 'app/build.gradle'},
                                  'region': {'startLine': 1}
                              }
                          }]

              with open(path, 'w') as f:
                  json.dump(data, f, indent=2)
              print('Successfully patched SARIF file.')
          except Exception as e:
              print(f'Error patching SARIF: {e}')
          "

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.path-to-file }}.sarif # Path to your SARIF file
