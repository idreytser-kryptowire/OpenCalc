# --- UPDATED STEP TO FIX SARIF LOCATIONS AND IDs ---
      - name: Fix SARIF format issues
        run: |
          python3 -c "
          import json
          path = '${{ env.path-to-file }}.sarif'
          try:
              with open(path, 'r') as f:
                  data = json.load(f)

              # Loop through results to apply fixes
              for run in data.get('runs', []):
                  for res in run.get('results', []):
                      # 1. Inject a dummy location if missing
                      if not res.get('locations'):
                          res['locations'] = [{
                              'physicalLocation': {
                                  'artifactLocation': {'uri': 'app/build.gradle'},
                                  'region': {'startLine': 1}
                              }
                          }]

                      # 2. Convert threadFlow IDs from integers to strings
                      for cf in res.get('codeFlows', []):
                          for tf in cf.get('threadFlows', []):
                              if 'id' in tf and not isinstance(tf['id'], str):
                                  tf['id'] = str(tf['id'])

              with open(path, 'w') as f:
                  json.dump(data, f, indent=2)
              print('Successfully patched SARIF file.')
          except Exception as e:
              print(f'Error patching SARIF: {e}')
          "

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.path-to-file }}.sarif
